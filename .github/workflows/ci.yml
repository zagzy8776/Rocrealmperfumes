name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        env:
          VITE_SITE_URL: https://example.invalid
          VITE_API_URL: https://example.invalid/api
        run: npm run build
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Test server
        working-directory: server
        run: npm test
